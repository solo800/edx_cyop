assignment: Machine Learning Capstone Project
total_points: 75
total_with_variations: 100


grading_categories:
  - category: Files Submission
    max_points: 5
    criteria:
      - level: No files
        points: 0
        description: No files submitted
      - level: Missing
        points: 3
        description: Some required files submitted but incomplete
      - level: All correct
        points: 5
        description: All required files submitted correctly


  - category: Report
    max_points: 25
    variation_bonus: 15
    criteria:
      - level: Poor
        points: 0
        description: Report is of poor quality or largely incomplete
      - level: Incomplete
        points: 5
        description: Report missing substantial content
      - level: Missing supporting detail in multiple sections
        points: 10
        description: Report structure present but lacks depth in 2+ sections
      - level: Missing supporting detail in one section
        points: 15
        description: Report mostly complete, one section needs more detail
      - level: Minor flaws
        points: 20
        description: Report is good with only small issues
      - level: Excellent
        points: 25
        description: Report is comp